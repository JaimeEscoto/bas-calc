<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Básica</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1f26;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .calc {
      width: 320px;
      background: #2b2d38;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .display {
      background: #1a1b22;
      color: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: right;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }

    .previous {
      color: #8a8ca0;
      font-size: 16px;
      min-height: 20px;
    }

    .current {
      font-size: 40px;
      word-wrap: break-word;
      word-break: break-all;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 12px;
      font-size: 22px;
      cursor: pointer;
      background: #3a3d4c;
      color: #fff;
      transition: filter 0.1s, transform 0.05s;
    }

    button:hover { filter: brightness(1.2); }
    button:active { transform: scale(0.96); }

    .op { background: #ff9f0a; }
    .fn { background: #5a5d6e; }
    .equals { background: #30c060; }
    .zero { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calc">
    <div class="display">
      <div class="previous" id="previous"></div>
      <div class="current" id="current">0</div>
    </div>

    <div class="keys">
      <button class="fn" data-action="clear">C</button>
      <button class="fn" data-action="delete">⌫</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-op="/">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="*">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="-">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="zero" data-num="0">0</button>
      <button data-num=".">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </div>

  <script>
    const currentEl = document.getElementById('current');
    const previousEl = document.getElementById('previous');
    const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };

    let current = '0';
    let previous = null;
    let operator = null;
    let resetNext = false;

    function render() {
      currentEl.textContent = current;
      previousEl.textContent = operator ? `${previous} ${symbols[operator]}` : '';
    }

    function inputNumber(n) {
      if (current === 'Error' || resetNext) {
        current = '0';
        resetNext = false;
      }
      if (n === '.' && current.includes('.')) return;
      current = current === '0' && n !== '.' ? n : current + n;
    }

    function compute(a, b, op) {
      a = parseFloat(a);
      b = parseFloat(b);
      let result;
      switch (op) {
        case '+': result = a + b; break;
        case '-': result = a - b; break;
        case '*': result = a * b; break;
        case '/': if (b === 0) return 'Error'; result = a / b; break;
      }
      // Evita errores de punto flotante como 0.1 + 0.2 = 0.30000000000000004
      return String(parseFloat(result.toPrecision(12)));
    }

    function chooseOperator(op) {
      if (current === 'Error') return;
      if (operator && !resetNext) {
        current = compute(previous, current, operator);
        if (current === 'Error') { operator = null; previous = null; return; }
      }
      previous = current;
      operator = op;
      resetNext = true;
    }

    function equals() {
      if (!operator || current === 'Error') return;
      current = compute(previous, current, operator);
      previous = null;
      operator = null;
      resetNext = true;
    }

    function clearAll() {
      current = '0';
      previous = null;
      operator = null;
      resetNext = false;
    }

    function deleteLast() {
      if (resetNext || current === 'Error') { current = '0'; resetNext = false; return; }
      current = current.length > 1 ? current.slice(0, -1) : '0';
      if (current === '-') current = '0';
    }

    function percent() {
      if (current === 'Error') return;
      current = String(parseFloat(current) / 100);
    }

    document.querySelector('.keys').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const { num, op, action } = btn.dataset;

      if (num !== undefined) inputNumber(num);
      else if (op) chooseOperator(op);
      else if (action === 'equals') equals();
      else if (action === 'clear') clearAll();
      else if (action === 'delete') deleteLast();
      else if (action === 'percent') percent();

      render();
    });

    // Soporte de teclado
    document.addEventListener('keydown', (e) => {
      const k = e.key;
      if (/^[0-9.]$/.test(k)) inputNumber(k);
      else if (['+', '-', '*', '/'].includes(k)) chooseOperator(k);
      else if (k === 'Enter' || k === '=') { e.preventDefault(); equals(); }
      else if (k === 'Backspace') deleteLast();
      else if (k === 'Escape') clearAll();
      else if (k === '%') percent();
      else return;
      render();
    });

    render();
  </script>
</body>
</html>
